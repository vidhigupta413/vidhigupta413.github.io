<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaidehi Gupta | Portfolio</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    #root, body, html {
      height: 100%;
      margin: 0;
    }
    .devpost-gradient {
      background: linear-gradient(135deg, #003e54 0%, #007da6 100%);
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased">
  <div id="root"></div>

  <script type="text/jsx">
    const icons = {
      Mail: (props) => (
        <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>
      ),
      Linkedin: (props) => (
        <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" /></svg>
      ),
      Github: (props) => (
        <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-0.4 6.7-1.6 6.7-7A5 5 0 0 0 19 8.5c0-1-0.5-2-1.2-3.5c0 0-1-0.3-2.5 0.9A9 9 0 0 0 12 6.5C10.6 6.5 9.3 6.7 8 7.3c-1.5-1.2-2.5-0.9-2.5-0.9C4.5 6.5 4 7.5 4 8.5A5 5 0 0 0 5.8 12c0 5.4 3.4 6.6 6.7 7c-0.2 0.2-0.3 0.6-0.3 1v3" /><path d="M9 18c-2.3 0-2.8-1.5-2.8-1.5" /></svg>
      ),
      ExternalLink: (props) => (
        <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>
      )
    };

    const aboutMeData = {
      name: "Vaidehi Gupta",
      title: "AI & HCI Specialist",
      bio: "A Computer Science student at Georgia Institute of Technology specializing in Artificial Intelligence and Human-Computer Interaction. I am passionate about creating clean, efficient, and user-friendly solutions that solve real-world problems. My experience includes developing ML models, building web applications, and teaching coding.",
      image: "https://placehold.co/250x250/5B21B6/F0ABFC?text=VG",
    };

    const educationData = {
      school: "Georgia Institute of Technology (GT)",
      degree: "B.S. in Computer Science",
      specializations: "Specializations: Artificial Intelligence, Human Computer Interaction",
      relevantCoursework: ["Data Structures & Algorithms", "Objects and Design", "Design & Analysis of Algorithms", "Introduction to Artificial Intelligence", "Intro to Perception & Robotics", "Statistics & Applications"]
    };

    const experienceData = [
      { company: "Blue AI Labs", title: "Machine Learning Consultant", dates: "Jul 2025 - Present", description: ["Researched and proposed advanced AI features to improve call note app's feedback loop.", "Ensured model reproducibility and code quality through meticulous documentation."] },
      { company: "HIVE at GT College of Computing", title: "PLUS Session Leader", dates: "Aug 2025 - Present", description: ["Facilitated Peer-Led Undergraduate Study (PLUS) sessions for CS 1332 and CS 3600.", "Created engaging content and session plans to simplify complex concepts."] },
      { company: "theCoderSchool", title: "Code Coach", dates: "Mar 2023 - Jul 2024", description: ["Taught 10+ kids coding with Python, robotics, 3D printing, and game development."] }
    ];

    const projectsData = [
      { title: "Sentra: Full-Stack Multi-Modal AI App", description: "Multi-modal AI application integrating CV, NLP, and speech synthesis.", link: "https://github.gatech.edu/tparida3/Sentra.git" },
      { title: "VR State Analysis", description: "ML models to predict identity and heart rate using VR data.", link: "https://docs.google.com/presentation/d/11tZQ2ZXOaQ41iqt3E1742TsErcq7jBCISkzSLTtwXX4/edit?usp=sharing" },
      { title: "MemoryMap", description: "Django web app with chatbot integration and role-based logic.", link: "https://github.com/yashilaramesh/MemoryMap" }
    ];

    const DevpostSection = () => (
      <section id="devpost" className="py-12 px-4 md:px-8 bg-black">
        <div className="max-w-4xl mx-auto">
          <div className="devpost-gradient p-8 rounded-2xl shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6 border border-white/10 hover:scale-[1.01] transition-transform">
            <div className="text-center md:text-left">
              <h2 className="text-2xl md:text-3xl font-bold text-white mb-2">Hackathon Portfolio</h2>
              <p className="text-blue-100/80 max-w-md">
                Check out my full collection of hackathon projects, submissions, and awards on Devpost.
              </p>
            </div>
            <a 
              href="https://devpost.com/vidhi_gupta413?ref_content=user-portfolio&ref_feature=portfolio&ref_medium=global-nav" 
              target="_blank" 
              rel="noopener noreferrer"
              className="bg-white text-blue-900 px-8 py-3 rounded-full font-bold flex items-center gap-2 hover:bg-blue-50 transition-colors shadow-lg"
            >
              View on Devpost
              <icons.ExternalLink className="w-5 h-5" />
            </a>
          </div>
        </div>
      </section>
    );

    const Contact = () => (
      <section id="contact" className="py-20 px-4 md:px-8 bg-black">
        <div className="max-w-4xl mx-auto text-center">
          <h2 className="text-4xl font-bold mb-4 text-purple-600">Get in Touch</h2>
          <div className="flex justify-center space-x-8 mt-8">
            <a href="mailto:vgupta409@gatech.edu" className="hover:text-purple-600 transition-colors"><icons.Mail className="w-10 h-10" /></a>
            <a href="https://linkedin.com/in/vaidehi-gupta-89107a228" target="_blank" className="hover:text-purple-600 transition-colors"><icons.Linkedin className="w-10 h-10" /></a>
            <a href="https://github.com/vidhigupta413" target="_blank" className="hover:text-purple-600 transition-colors"><icons.Github className="w-10 h-10" /></a>
          </div>
        </div>
      </section>
    );

    const App = () => (
      <div className="bg-black text-white">
        <header className="fixed w-full z-50 flex items-center justify-between p-4 md:px-12 bg-black/80 backdrop-blur-md border-b border-white/5">
          <div className="text-xl font-bold text-purple-600">{aboutMeData.name}</div>
          <nav className="hidden md:flex space-x-8 text-sm font-medium text-gray-400">
            <a href="#about" className="hover:text-white transition-colors">About</a>
            <a href="#experience" className="hover:text-white transition-colors">Experience</a>
            <a href="#projects" className="hover:text-white transition-colors">Projects</a>
            <a href="#contact" className="hover:text-white transition-colors">Contact</a>
          </nav>
        </header>

        <section className="h-screen flex items-center justify-center pt-20">
          <div className="text-center px-4">
            <h1 className="text-5xl md:text-7xl font-extrabold mb-4">{aboutMeData.name}</h1>
            <p className="text-xl md:text-2xl text-purple-400 font-light">{aboutMeData.title}</p>
          </div>
        </section>

        <section id="about" className="py-24 px-4 bg-gray-900/50">
          <div className="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-12">
            <img src={aboutMeData.image} className="w-48 h-48 rounded-2xl border-2 border-purple-500/50" />
            <div>
              <h2 className="text-3xl font-bold mb-6">About Me</h2>
              <p className="text-gray-400 leading-relaxed text-lg">{aboutMeData.bio}</p>
            </div>
          </div>
        </section>

        <section id="experience" className="py-24 px-4">
          <div className="max-w-4xl mx-auto">
            <h2 className="text-3xl font-bold mb-12 text-center">Experience</h2>
            <div className="space-y-8">
              {experienceData.map((job, i) => (
                <div key={i} className="bg-gray-900/40 p-8 rounded-xl border border-white/5">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h3 className="text-xl font-bold text-purple-500">{job.title}</h3>
                      <p className="text-gray-400">{job.company}</p>
                    </div>
                    <span className="text-xs text-gray-500 uppercase tracking-widest">{job.dates}</span>
                  </div>
                  <ul className="space-y-2 text-gray-400 text-sm">
                    {job.description.map((p, j) => <li key={j}>• {p}</li>)}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </section>

        <DevpostSection />

        <section id="projects" className="py-24 px-4 bg-gray-900/30">
          <div className="max-w-4xl mx-auto">
            <h2 className="text-3xl font-bold mb-12 text-center">Featured Projects</h2>
            <div className="grid md:grid-cols-2 gap-6">
              {projectsData.map((project, i) => (
                <a key={i} href={project.link} className="group bg-gray-900 p-8 rounded-xl border border-white/5 hover:border-purple-500/50 transition-all">
                  <h3 className="text-lg font-bold mb-2 group-hover:text-purple-400">{project.title}</h3>
                  <p className="text-gray-400 text-sm mb-6">{project.description}</p>
                  <div className="flex items-center text-xs font-bold text-purple-500 uppercase tracking-wider">
                    View Project <icons.ExternalLink className="ml-2 w-3 h-3" />
                  </div>
                </a>
              ))}
            </div>
          </div>
        </section>

        <Contact />
        <footer className="py-8 text-center text-gray-600 text-sm border-t border-white/5">
          &copy; {new Date().getFullYear()} {aboutMeData.name}
        </footer>
      </div>
    );

    window.onload = () => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    };
  </script>
</body>
</html>
