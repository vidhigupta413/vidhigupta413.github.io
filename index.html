<!DOCTYPE html>
<html lang="en">
<head>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    #root, body, html {
      height: 100%;
      margin: 0;
    }
    .devpost-gradient {
      background: linear-gradient(135deg, #003e54 0%, #007da6 100%);
    }
  </style>
</head>
<body class="bg-black text-white font-sans antialiased">
  <div id="root"></div>

  <script type="text/jsx">
    const icons = {
      Mail: (props) => (
        <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg>

      title: "AI & HCI Specialist",

    };

    const educationData = {
      school: "Georgia Institute of Technology (GT)",
      degree: "B.S. in Computer Science",
      specializations: "Specializations: Intelligence, People",

        "Data Structures & Algorithms", "Objects and Design", "Design & Analysis of Algorithms",

    };

    const experienceData = [
      { 
        company: "Responsible AI for Medical Image Analysis (VIP)", 
        title: "Undergraduate Researcher", 
        dates: "Aug 2025 - Present", 
        description: [
          "Engineered high-performing PyTorch classifier with EfficientNet-B1 on 30k+ images, creating data pipelines to resolve class imbalance.",
          "Optimized reliability by conducting systematic failure mode analysis with AUC-ROC/F1-score metrics to guide backend refinements.",
          "Collaborated in an Agile development environment to align outputs with rigorous medical reliability standards, achieving 92% recall."
        ] 
      },
      { 
        company: "HIVE at GT College of Computing", 
        title: "HELP Session Leader & Peer Coach", 
        dates: "Aug 2025 - Present", 
        description: [
          "Instructed technical workshops for CS 1332/3600, clarifying complex DSA and AI concepts for students.",

      },
      { 
        company: "Blue AI Labs", 
        title: "Machine Learning Consultant", 
        dates: "Jul 2025 - Aug 2025", 
        description: [
          "Developed technical implementation roadmap for 9 AI-driven features by analyzing backend architecture.",
          "Translated complex theoretical models into granular technical specifications for scalable software integration."
        ] 
      }
    ];

    const skillsData = [
      { category: "Languages", items: ["Python", "Java", "SQL", "C", "JavaScript", "HTML/CSS"] },
      { category: "AI/ML Frameworks", items: ["PyTorch", "TensorFlow", "Keras", "Scikit-learn", "Pandas", "NumPy", "OpenCV", "DeepFace"] },

      { category: "Product & Strategy", items: ["Agile/Scrum", "Product Roadmapping", "Stakeholder Management", "User Research"] }

    const projectsData = [
      { 
        title: "Sentra: Multimodal Architecture", 
        description: "Engineered a synchronized backend pipeline in Python to process real-time data streams from Computer Vision and NLP modules. Developed a responsive React/Next.js frontend using Generative AI APIs.",

        tags: ["Python", "Generative AI", "React"]
      },
      { 
        title: "MemoryMap: RESTful Backend", 
        description: "Designed a RESTful Django backend with secure authentication and Google Gemini API integration. Optimized prompt-handling logic for efficient spatial data retrieval.", 
        link: "https://github.com/yashilaramesh/MemoryMap",
        tags: ["Django", "Gemini API", "Python"]

      {

          <div className="grid md:grid-cols-2 gap-8">
            {skillsData.map((skill, i) => (
              <div key={i} className="bg-black/40 p-6 rounded-xl border border-white/5">
                <h3 className="text-lg font-bold text-purple-400 mb-4">{skill.category}</h3>
                <div className="flex flex-wrap gap-2">

                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

    const ProjectsSection = () => (

              <a key={i} href={project.link} target="_blank" className="group bg-gray-900/40 p-8 rounded-xl border border-white/5 hover:border-purple-500/50 transition-all">

                  {project.tags.map((tag, t) => (
                    <span key={t} className="text-[10px] uppercase tracking-widest text-purple-400 bg-purple-900/20 px-2 py-0.5 rounded">

                    </span>
                  ))}

                <h3 className="text-xl font-bold mb-3 group-hover:text-purple-400">{project.title}</h3>
                <p className="text-gray-400 text-sm mb-6 leading-relaxed">{project.description}</p>
                <div className="flex items-center text-xs font-bold text-purple-500 uppercase tracking-wider">
                  View Source <icons.ExternalLink className="ml-2 w-3 h-3" />

          <div className="devpost-gradient p-8 rounded-2xl shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6 border border-white/10 hover:scale-[1.01] transition-transform">
            <div className="text-center md:text-left">
              <h2 className="text-2xl md:text-3xl font-bold text-white mb-2">Hackathon Portfolio</h2>

            <a href="#education" className="hover:text-white transition-colors">Education</a>

                <p className="text-purple-400 font-medium mb-4">{educationData.degree} (Expected 05/27)</p>

                </div>
            </div>
          </div>
        </section>

        <SkillsSection />

        <section id="experience" className="py-24 px-4">
          <div className="max-w-4xl mx-auto">
            <h2 className="text-3xl font-bold mb-12 text-center text-purple-600">Experience</h2>
            <div className="space-y-8">
              {experienceData.map((job, i) => (
                <div key={i} className="bg-gray-900/40 p-8 rounded-xl border border-white/5">
                  <div className="flex justify-between items-start mb-4">
                    <div>
                      <h3 className="text-xl font-bold text-purple-500">{job.title}</h3>
                      <p className="text-gray-400">{job.company}</p>
                    </div>
                    <span className="text-xs text-gray-500 uppercase tracking-widest">{job.dates}</span>
                  </div>
                  <ul className="space-y-3 text-gray-400 text-sm leading-relaxed">
                    {job.description.map((p, j) => <li key={j} className="flex gap-2"><span>•</span>{p}</li>)}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </section>

        <DevpostSection />
        
        <ProjectsSection />

        <footer className="py-12 text-center text-gray-600 text-sm border-t border-white/5 bg-black">
          <div className="flex justify-center space-x-6 mb-4">
            <a href="mailto:vgupta409@gatech.edu" className="hover:text-purple-600 transition-colors"><icons.Mail /></a>
            <a href="https://linkedin.com/in/vaidehigupta13" target="_blank" className="hover:text-purple-600 transition-colors"><icons.Linkedin /></a>
            <a href="https://github.com/vidhigupta413" target="_blank" className="hover:text-purple-600 transition-colors"><icons.Github /></a>
          </div>
          &copy; {new Date().getFullYear()} {aboutMeData.name} | Built with React & Tailwind
        </footer>
      </div>
    );

    window.onload = () => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    };

</body>
</html>
